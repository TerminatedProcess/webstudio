# Self-host stack for the Webstudio builder on Coolify (dev/staging ONLY).
#
# Web service = "builder" on port 3000 (assign the public domain to it).
# db + postgrest are internal-only — never publish their ports.
#
# Coolify env-substitution notes (see coolify-app-publish skill):
#   - Vars written as ${VAR} (no :-default) so Coolify-set values actually apply.
#   - Set POSTGRES_PASSWORD, AUTH_SECRET, PLANS via `PATCH /applications/<uuid>/envs/bulk`.
#   - DB name/user are non-secret literals below.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: webstudio
      POSTGRES_USER: webstudio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      # First-boot bootstrap: postgres runs *.sql in this dir only when the data
      # dir is empty, so the schema snapshot seeds a fresh volume once.
      - ./apps/builder/e2e/schema/current.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webstudio -d webstudio"]
      interval: 2s
      timeout: 2s
      retries: 30

  postgrest:
    image: postgrest/postgrest:v12.2.12
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://webstudio:${POSTGRES_PASSWORD}@db:5432/webstudio
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: webstudio
      PGRST_SERVER_PORT: 3000

  builder:
    build:
      context: .
      dockerfile: apps/builder/Dockerfile
    restart: unless-stopped
    depends_on:
      - postgrest
    environment:
      PORT: 3000
      NODE_ENV: production
      # "preview" = staging semantics; "production" throws unless real OAuth creds are set.
      DEPLOYMENT_ENVIRONMENT: preview
      DEV_LOGIN: "true"
      AUTH_SECRET: ${AUTH_SECRET}
      PLANS: ${PLANS}
      POSTGREST_URL: http://postgrest:3000
    volumes:
      # Uploaded assets (no S3 configured) live under <cwd>/public/cgi/asset.
      - assets:/app/apps/builder/public/cgi/asset
    expose:
      - "3000"

volumes:
  db-data:
  assets:
